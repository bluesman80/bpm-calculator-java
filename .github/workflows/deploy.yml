name: Deploy to Remote Server

on:
  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push with Maven
        run: mvn -B install -Ddocker.username=${{ secrets.DOCKERHUB_USERNAME }} -Ddocker.password=${{ secrets.DOCKERHUB_TOKEN }} --file pom.xml

      - name: Copy docker-compose.yml to Remote Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: ${{ secrets.REMOTE_FINAL_TARGET }}

      - name: Deploy to Remote Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Modify docker-compose.yml for deployment
            sed -i 's/build: \./image: bluesman80\/bpm-calculator:latest/g' docker-compose.yml
            sed -i 's/- \.\/logs:\/app\/logs/- ${LOGS_PATH}:\/app\/logs/g' docker-compose.yml

            # Set environment variables
            export RDW_API_TOKEN=${{ secrets.RDW_API_TOKEN }}
            export LOGS_PATH=${{ secrets.REMOTE_LOGS_PATH }}

            # Pull the latest image and restart the service
            docker-compose pull
            docker-compose up -d
