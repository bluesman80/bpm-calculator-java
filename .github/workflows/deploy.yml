name: Deploy to Remote Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push with Maven
        run: mvn -B install -Ddocker.username=${{ secrets.DOCKERHUB_USERNAME }} -Ddocker.password=${{ secrets.DOCKERHUB_TOKEN }} --file pom.xml

      - name: Copy docker-compose.yml to Remote Server
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: "target/"
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          REMOTE_PORT: ${{ secrets.REMOTE_PORT }}
          TARGET: ${{ secrets.REMOTE_TARGET }}
          EXCLUDE: "/bpm-calculator-0.0.1-SNAPSHOT/, /classes/, /generated-sources/, /generated-test-sources/, /maven-archiver/, /maven-status/, /surefire-reports/, /test-classes/"
          SCRIPT_AFTER: |
            cp ${{ secrets.REMOTE_TARGET }}/docker-compose.yml ${{ secrets.REMOTE_FINAL_TARGET }}/docker-compose-bpm.yml
          SCRIPT_AFTER_REQUIRED: true

      - name: Deploy to Remote Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          port: ${{ secrets.REMOTE_SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Set environment variables
            export RDW_API_TOKEN=${{ secrets.RDW_API_TOKEN }}
            export LOGS_PATH=${{ secrets.REMOTE_LOGS_PATH }}/bpm-calculator

            # Pull the latest image and restart the service
            docker compose -f docker-compose-bpm.yml pull
            docker compose -f docker-compose-bpm.yml up -d
